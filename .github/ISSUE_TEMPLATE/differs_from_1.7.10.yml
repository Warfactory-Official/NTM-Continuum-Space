name: Differs from 1.7.10
description: "Something works differently than in NTM: Space for Minecraft 1.7.10."
labels: ["1.7 parity"]
body:
  - type: markdown
    attributes:
      value: |
        NTM: Space aims to match **NTM: Space for 1.7.10** (the space fork of HBM's Nuclear Tech Mod) as closely
        as possible: planets, rockets, machines, recipes, numbers, GUIs, models and effects. If something differs
        from 1.7.10, tell us here.

        Differences from other ports are not bugs on their own; 1.7.10 is the reference. Differences that also show
        **without NTM: Space installed** belong to NTM - Continuum.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you report
      options:
        - label: "I searched the existing issues and this difference has not been reported yet."
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Planets, moons or orbit
        - Sky, atmosphere or weather
        - Rockets, launch pads or space stations
        - Recipe or crafting
        - Machine behaviour or numbers
        - GUI / interface
        - Model, texture or visual effect
        - Sound
        - World generation or structures
        - Mobs or entities
        - Other
    validations:
      required: true

  - type: dropdown
    id: target
    attributes:
      label: Minecraft version and loader
      description: Where you saw the difference.
      options:
        - 26.1.2 NeoForge
        - 26.1.2 Fabric
        - 1.21.1 NeoForge
        - 1.21.1 Fabric
        - 1.20.1 Forge
        - 1.20.1 Fabric
        - All of them / not version-specific
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "NTM: Space version"
      placeholder: 0.1.0
    validations:
      required: true

  - type: textarea
    id: original
    attributes:
      label: How it works in 1.7.10
      description: The 1.7.10 behaviour. Screenshots, a wiki page or the source code location help a lot.
    validations:
      required: true

  - type: textarea
    id: port
    attributes:
      label: "How it works in NTM: Space"
      description: What happens instead, and how to see it (blocks, items, machines, planets involved).
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Screenshots
      description: Side-by-side screenshots of both versions are the clearest evidence.
