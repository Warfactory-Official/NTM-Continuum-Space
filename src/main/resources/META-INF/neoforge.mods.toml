modLoader = "javafml"
loaderVersion = "${neoforge_loader_range}"
license = "${mod_license}"
issueTrackerURL = "@golem.issues@"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "@golem.homepage@"
authors = "${mod_author}"
description = '''${mod_description}@golem.credits@'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

# AFTER both: this mod's constructor uses Golem Core's mod bus and HBM's registries (see NTM-Continuum's neoforge.mods.toml).
[[dependencies.${mod_id}]]
modId = "golemcore"
type = "required"
versionRange = "[0.1.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "hbm"
type = "required"
versionRange = "[0.1.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"
