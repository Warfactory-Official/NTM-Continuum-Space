# Root defaults. Values marked [VERSIONED] are overridden per node in versions/<node>/gradle.properties.

org.gradle.jvmargs=-Xmx3G -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod identity
mod.id=ntmspace
mod.name=NTM: Space
mod.group=com.ntmspace
mod.version=0.1.0
mod.author=Golem
mod.license=LGPL-3.0
mod.homepage=https://github.com/Warfactory-Official/NTM-Continuum-Space
mod.sources=https://github.com/Warfactory-Official/NTM-Continuum-Space
mod.issues=https://github.com/Warfactory-Official/NTM-Continuum-Space/issues
# One short line, shown last in the mod list; every contributor is in CREDITS.txt (shipped in the jar).
mod.credits=JamesH2, MellowArpeggiation and the NTM: Space team
mod.description=Space travel, planets and progression for NTM - Continuum.

# The mods this addon is built on (composite builds in settings.gradle.kts).
deps.golemcore=0.1.0
deps.hbm=0.1.0

# Golem Core's shared build layer (../Golem-Core/gradle/mod). The addon declares no Dejson classes yet.
golem.build.dejson.classes=gradle/dejson-classes.txt
golem.build.dejson.authored=gradle/dejson-authored.txt
# legacy-recipes routes count-carrying smelts below 26.1 through a component smelting serializer; the addon registers
# none of its own, so it uses HBM's (the default would be the unregistered ntmspace:component_smelting).
golem.build.legacyRecipes.componentSmeltingType=hbm:component_smelting
# legacy-assets below 1.21.4: the addon's item definitions use HBM's item-model vocabulary (hbm:machine_obj, hbm:custom_item
# and HBM's hbm:item/*_legacy frame markers, shipped in HBM's jar), so the conversion must read that namespace, not the
# default mod.id (ntmspace:machine_obj exists nowhere). With the default, the 63 OBJ / custom-item definitions got no
# models/item file and every legacy client logged "Unable to load model 'ntmspace:...'" for them.
golem.build.legacyAssets.modelNamespace=hbm
golem.build.legacyAssets.selfRenderedSpecialTypes=hbm:machine_obj,hbm:rbmk_fuel_column,hbm:rbmk_block_column
# selects on HBM's hbm:model_state (the RBMK pellets) become ordered overrides below 1.21.4; the client predicate is
# extended to ntmspace items in SpaceClient (ItemModelProperties.includeItems)
golem.build.legacyAssets.selectProperties=hbm:model_state

# [VERSIONED] Per-node values
deps.minecraft=[VERSIONED]
deps.minecraft_range=[VERSIONED]
java_version=[VERSIONED]
pack_format=[VERSIONED]

deps.fabric_loader=[VERSIONED]
deps.fabric_api=[VERSIONED]

deps.neoforge=[VERSIONED]
deps.neoforge_loader_range=[VERSIONED]

deps.forge=[VERSIONED]
deps.forge_loader_range=[VERSIONED]

deps.jei_mc=[VERSIONED]
deps.jei=[VERSIONED]

loomx.loom_version=1.16.3
deps.lwjgl=[VERSIONED]
golem.build.resourceTasks=processResources,processProbeResources
# Release jars drop the GameTests (../Golem-Core/gradle/mod/release-jar.gradle.kts).
golem.build.releaseJar.testPackages=com/ntmspace/gametest/

# Release upload (../Golem-Core/gradle/mod/publish.gradle.kts documents every key). A blank project id skips that
# site. Tokens come from MODRINTH_TOKEN / CURSEFORGE_TOKEN or ~/.gradle/gradle.properties, never from this file.
golem.build.publish.modrinthProject=5Q9MaiIH
golem.build.publish.curseforgeProject=1754149
# Golem Core and NTM - Continuum: Modrinth project IDs (work while unapproved). CurseForge only links approved
# projects: add their CurseForge slugs here once both are approved.
golem.build.publish.modrinthRequires=sRSYLbXB,sr7XEjTN
golem.build.publish.curseforgeRequires=golem-core,ntm-continuum
golem.build.publish.fabricRequires=fabric-api
